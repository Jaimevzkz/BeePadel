name: Mobile Deployment Workflow
on:
  workflow_dispatch:
#  push:
#    branches:
#      - '**/release'
jobs:
  build-phone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Setup Gradle Cache
        uses: gradle/gradle-build-action@v2
        with:
          gradle-home-cache-cleanup: true

      - name: Extract version info from branch
        id: extract_version
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          VERSION_NAME="${BRANCH_NAME%/release}"
          VERSION_CODE=$(echo $VERSION_NAME | awk -F. '{printf("%d%03d%03d", $1, $2, $3)}')

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV

      - name: Update libs.versions.toml with new versions
        run: |
          sed -i "s/^projectVersionName = .*/projectVersionName = \"0${VERSION_NAME}\"/" gradle/libs.versions.toml
          sed -i "s/^projectVersionCode = .*/projectVersionCode = \"0${VERSION_CODE}\"/" gradle/libs.versions.toml
          cat gradle/libs.versions.toml

      - name: Build Mobile prodRelease
        run: ./gradlew :app:bundleRelease
        continue-on-error: false

      - name: Sign Mobile AAB
        id: sign
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: '${{ secrets.KEYSTORE }}'
          alias: '${{ secrets.SIGNING_KEY_ALIAS }}'
          keyStorePassword: '${{ secrets.SIGNING_STORE_PASSWORD }}'
          keyPassword: '${{ secrets.SIGNING_KEY_PASSWORD }}'

      - name: Upload Mobile bundle as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 2
        continue-on-error: false
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Mobile bundle
        uses: actions/download-artifact@v4
        with:
          name: app-bundle
          path: ${{ github.workspace }}

      - name: Publish Mobile app to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: '${{ secrets.SERVICE_ACCOUNT_JSON }}'
          packageName: com.vzkz.beepadel
          releaseFiles: ${{ github.workspace }}/app-release.aab
          track: production
          whatsNewDirectory: BeePadel/release-notes/mobile

